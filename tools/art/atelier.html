<script>
  // API para o construtor (build.py): ART.run(nome) → { png, meta } ; ART.list() → nomes
  window.ART.list = () => Object.keys(window.ART.registry);
  window.ART.run = (name) => {
    const r = window.ART.registry[name]();
    if (r.canvas) return { png: r.canvas.toDataURL('image/png'), meta: r.meta || null, kind: r.kind || 'sheet' };
    if (r.images) return { images: Object.fromEntries(Object.entries(r.images).map(([k, cv]) => [k, cv.toDataURL('image/png')])), meta: r.meta || null, kind: 'images' };
    return null;
  };
  window.ART.previewAny = (name) => (name.startsWith('hero') || name === 'weapons' ? (window.ART.preview ? window.ART.preview(name) : null) : window.ART.previewSheet(window.ART.registry[name](), 3, window.ART.previewCell && window.ART.previewCell[name]));
  document.title = 'ready';
</script>
