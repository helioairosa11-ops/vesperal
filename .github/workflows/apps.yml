# Cria o Vesperal para Windows (.exe) e Android (.apk) nas máquinas do GitHub e põe-nos numa "Release" para descarregar.
# Corre quando muda a versão (desktop/package.json ou android-app/package.json) ou à mão, em Actions →
# "Criar Windows e Android" → Run workflow. A Release chama-se v<versão> (a de desktop/package.json).
name: Criar Windows e Android

on:
  push:
    branches: [main]
    paths: ['desktop/package.json', 'android-app/package.json', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar o Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Criar o instalador e o executável portátil
        working-directory: desktop
        run: npm run exe:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar a app (Capacitor)
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npm run copiar-jogo
          npx cap add android
          npx cap sync android
      - name: Ecrã inteiro, horizontal e ícone do jogo
        working-directory: android-app
        run: |
          set -e
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="sensorLandscape"|' "$MAN"
          grep -q 'sensorLandscape' "$MAN"
          cp res/MainActivity.java android/app/src/main/java/pt/lourencemanuel/vesperal/MainActivity.java
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}; mkdir -p "$RES/mipmap-$n"
            convert ../desktop/build/icon.png -resize ${s}x${s} "$RES/mipmap-$n/ic_launcher.png"
            cp "$RES/mipmap-$n/ic_launcher.png" "$RES/mipmap-$n/ic_launcher_round.png"
            cp "$RES/mipmap-$n/ic_launcher.png" "$RES/mipmap-$n/ic_launcher_foreground.png"
          done
      - name: Compilar o APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          V=$(node -p "require('../../desktop/package.json').version")
          cp app/build/outputs/apk/debug/app-debug.apk "../Vesperal-$V-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-app/*.apk
          if-no-files-found: error

  release:
    name: Publicar para descarregar
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Criar a Release com os ficheiros
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          cat > notas.md <<'NOTES'
          **Vesperal: A Última Chama — versão de teste** (o jogo ainda está em desenvolvimento).

          ### Windows
          - **Instalador** (`...-instalador-windows.exe`): instala o jogo e cria um atalho no ambiente de trabalho.
          - **Portátil** (`...-windows-portatil.exe`): não instala nada — é só abrir.
          - O Windows pode avisar "O Windows protegeu o computador" (o jogo não tem assinatura digital paga): carrega em *Mais informações* → *Executar mesmo assim*.

          ### Android
          - Descarrega o `.apk` no telemóvel e abre-o. Da primeira vez o Android pede para permitir *instalar apps desconhecidas* a partir do navegador ou dos ficheiros.
          - Joga-se na horizontal, em ecrã inteiro, com os comandos de toque.

          As gravações ficam no próprio aparelho.
          NOTES
          TAG="v$(node -p "require('./desktop/package.json').version")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vesperal $TAG (versão de teste)" --notes-file notas.md --prerelease
          fi
